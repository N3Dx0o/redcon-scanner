<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invitation — REDCON OFFENCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0d1117;
               background-image:radial-gradient(ellipse at 70% 5%,rgba(201,53,63,.12) 0%,transparent 55%); }
        .auth-wrapper { width:100%;max-width:480px;padding:1rem; }
        .brand { font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:2rem;letter-spacing:.2em;color:#c9353f; }
        .sub { font-size:.7rem;letter-spacing:.25em;color:#636c76;text-transform:uppercase;margin-top:.25rem; }
        .auth-card { background:#161b22;border:1px solid #2d333b;border-radius:16px;padding:2rem;box-shadow:0 24px 80px rgba(0,0,0,.7); }
        .form-control { background:#0d1117;border-color:#2d333b;color:#f0f3f6;border-radius:10px; }
        .form-control:focus { background:#161b22;border-color:#c9353f;box-shadow:0 0 0 3px rgba(201,53,63,.18);color:#f0f3f6; }
        .form-label { color:#9198a1; }
        .btn-submit { background:#c9353f;border:none;color:#fff;font-weight:700;padding:.75rem;border-radius:10px;width:100%;transition:all .25s; }
        .btn-submit:hover { background:#e05561;box-shadow:0 4px 20px rgba(201,53,63,.4);transform:translateY(-2px);color:#fff; }
        .error-box { background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);border-radius:10px;color:#fca5a5;padding:.875rem 1rem;font-size:.875rem;margin-bottom:1.25rem; }
        .invite-box { background:#0d1117;border:1px solid #2d333b;border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.5rem; }
        .strength-bar { height:4px;border-radius:99px;background:#2d333b;margin-top:8px;overflow:hidden; }
        .strength-fill { height:100%;border-radius:99px;transition:width .3s,background .3s;width:0%; }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div style="text-align:center;margin-bottom:2rem;">
        <div class="brand">REDCON<span style="color:#9198a1;font-weight:400;font-size:1.4rem;margin-left:.3rem;">OFFENCE</span></div>
        <div class="sub">Security Scanner — Account Activation</div>
    </div>

    <div class="auth-card">
        <h2 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.25rem;margin-bottom:.25rem;">
            <i class="bi bi-person-check me-2" style="color:#c9353f"></i>Activate Your Account
        </h2>
        <p style="color:#9198a1;font-size:.875rem;margin-bottom:1.5rem;">Set a password to complete your registration.</p>

        <div class="invite-box">
            <div style="color:#9198a1;font-size:.8rem;margin-bottom:4px;">Invited as</div>
            <div style="font-weight:600;color:#f0f3f6;font-size:1rem;">{{ invite.username }}</div>
            <div style="color:#636c76;font-size:.85rem;margin-top:2px;">{{ invite.email }}</div>
            {% if invite.is_admin %}
            <div style="margin-top:8px;"><span style="background:rgba(201,53,63,.15);color:#c9353f;border:1px solid rgba(201,53,63,.3);border-radius:6px;padding:2px 10px;font-size:.8rem;font-weight:600;">ADMIN</span></div>
            {% endif %}
        </div>

        {% if error %}
        <div class="error-box"><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-1">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Min 8 characters" required minlength="8"
                       oninput="updateStrength(this.value)" autofocus>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            </div>
            <div class="mb-4 mt-3">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                       placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn-submit">
                <i class="bi bi-rocket-takeoff me-2"></i>Activate Account
            </button>
        </form>
    </div>
</div>
<script>
function updateStrength(val) {
    const fill = document.getElementById('strengthFill');
    let score = 0;
    if (val.length >= 8) score += 25;
    if (val.length >= 12) score += 25;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 25;
    if (/[0-9]/.test(val) || /[^a-zA-Z0-9]/.test(val)) score += 25;
    fill.style.width = score + '%';
    fill.style.background = score <= 25 ? '#ef4444' : score <= 50 ? '#f97316' : score <= 75 ? '#fbbf24' : '#3fb950';
}
</script>
</body>
</html>
