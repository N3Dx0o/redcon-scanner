{% extends "base.html" %}
{% block title %}Change Password — REDCON OFFENCE{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('home.index') }}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Change Password</li>
                </ol>
            </nav>

            <div class="card">
                <div class="card-header d-flex align-items-center gap-2">
                    <i class="bi bi-key-fill text-redcon"></i>
                    <span>Change Password</span>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger mb-3">
                        <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
                    </div>
                    {% endif %}
                    {% if success %}
                    <div class="alert alert-success mb-3">
                        <i class="bi bi-check-circle me-2"></i>{{ success }}
                    </div>
                    {% endif %}

                    <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-control" name="current_password" required autocomplete="current-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" name="new_password" required minlength="8" autocomplete="new-password">
                            <div class="form-text">Minimum 8 characters</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" name="confirm_password" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-check-lg me-2"></i>Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
