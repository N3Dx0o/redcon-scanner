<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — REDCON OFFENCE Security Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0a0c10;
            background-image:
                radial-gradient(ellipse at 70% 5%, rgba(201,53,63,0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 20% 80%, rgba(201,53,63,0.06) 0%, transparent 50%);
            font-family: 'Inter', sans-serif;
        }
        .auth-card {
            background: #161b22;
            border: 1px solid #2d333b;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 80px rgba(0,0,0,.7);
        }
        .brand { text-align: center; margin-bottom: 2rem; }
        .brand-redcon { color: #c9353f; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 1.3rem; letter-spacing: .12em; }
        .brand-offence { color: #f0f3f6; font-family: 'Space Grotesk', sans-serif; font-weight: 400; font-size: 1.3rem; }
        .auth-card h2 { color: #f0f3f6; font-weight: 700; font-size: 1.35rem; margin-bottom: .35rem; }
        .subtitle { color: #9198a1; font-size: .875rem; margin-bottom: 1.75rem; }
        .form-label { color: #9198a1; font-size: .8rem; font-weight: 500; }
        .form-control { background: #0d1117; border: 1px solid #2d333b; color: #f0f3f6; border-radius: 10px; padding: .65rem .9rem; }
        .form-control:focus { background: #161b22; border-color: #c9353f; box-shadow: 0 0 0 3px rgba(201,53,63,.18); color: #f0f3f6; }
        .form-control::placeholder { color: #636c76; }
        .btn-submit { background: linear-gradient(135deg, #c9353f, #e05561); border: none; color: #fff; font-weight: 700; width: 100%; padding: .75rem; border-radius: 10px; font-size: .95rem; box-shadow: 0 4px 20px rgba(201,53,63,.35); transition: all .2s; }
        .btn-submit:hover { background: linear-gradient(135deg, #a82a33, #c9353f); transform: translateY(-1px); }
        .password-strength { height: 4px; border-radius: 2px; margin-top: .4rem; transition: all .3s; }
    </style>
</head>
<body>
<div style="width:100%;padding:1rem;">
  <div class="auth-card mx-auto">
    <div class="brand">
      <span class="brand-redcon">REDCON</span><span class="brand-offence"> OFFENCE</span>
    </div>
    <h2>Set New Password</h2>
    <p class="subtitle">Choose a strong password for your account.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ 'danger' if cat == 'error' else 'success' }} py-2 mb-3" style="border-radius:10px;font-size:.875rem;">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" id="resetForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" name="password" id="password" required minlength="8" placeholder="Min 8 characters" autocomplete="new-password">
        <div class="password-strength" id="strengthBar" style="background:#2d333b;"></div>
        <small id="strengthText" class="text-muted" style="font-size:.75rem;"></small>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" name="confirm_password" id="confirm" required minlength="8" placeholder="Repeat password" autocomplete="new-password">
        <small id="matchText" class="text-muted" style="font-size:.75rem;"></small>
      </div>
      <button type="submit" class="btn btn-submit">Reset Password</button>
    </form>
  </div>
</div>
<script>
const pwd = document.getElementById('password');
const bar = document.getElementById('strengthBar');
const txt = document.getElementById('strengthText');
const cfm = document.getElementById('confirm');
const mtxt = document.getElementById('matchText');
pwd.addEventListener('input', () => {
    const v = pwd.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (v.length >= 12) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const colors = ['#2d333b','#c9353f','#e07b39','#e0c039','#2da84a'];
    const labels = ['','Weak','Fair','Good','Strong'];
    bar.style.background = colors[score] || colors[0];
    bar.style.width = (score * 20) + '%';
    txt.textContent = labels[score] || '';
    txt.style.color = colors[score] || '#9198a1';
});
cfm.addEventListener('input', () => {
    if (cfm.value && cfm.value !== pwd.value) {
        mtxt.textContent = 'Passwords do not match';
        mtxt.style.color = '#c9353f';
    } else if (cfm.value) {
        mtxt.textContent = 'Passwords match';
        mtxt.style.color = '#2da84a';
    } else {
        mtxt.textContent = '';
    }
});
document.getElementById('resetForm').addEventListener('submit', e => {
    if (cfm.value !== pwd.value) {
        e.preventDefault();
        mtxt.textContent = 'Passwords do not match';
        mtxt.style.color = '#c9353f';
    }
});
</script>
</body>
</html>
